trigger:
- main  

pool:
  vmImage: ubuntu-latest

variables:
  - group: backend-home-api

stages:
- stage: Deploy
  jobs:
  - job: DeployToVM
    steps:
    - task: CopyFilesOverSSH@0
      inputs:
        sshEndpoint: 'Home-api-svc'
        sourceFolder: '$(System.DefaultWorkingDirectory)'
        contents: '**'
        targetFolder: '/home/azureuser/construction_manage_api'


    - task: SSH@0
      name: Env
      inputs:
        sshEndpoint: 'Home-api-svc'
        runOptions: inline
        inline: |
           cd '/home/azureuser/construction_manage_api'
           sudo echo "Creating .env file..."
           
           sudo echo "OPENAI_API_KEY=$(API_KEY)" > .env

           sudo echo "SERPAPI_API_KEY=$(SERPAPI_API_KEY)" >> .env

           sudo echo "FIREBASE_CREDENTIALS_BASE64=$(FIREBASE_CREDENTIALS_BASE64)" >> .env

           sudo echo "STRIPE_SECRET_KEY=$(STRIPE_SECRET_KEY)" >> .env

           sudo echo "STRIPE_WEBHOOK_SECRET=$(STRIPE_WEBHOOK_SECRET)" >> .env

           sudo echo "HOME_DEPOT_CACHE_DAYS=$(HOME_DEPOT_CACHE_DAYS=)" >> .env

    - task: SSH@0
      name: DockerDeploy
      inputs:
        sshEndpoint: 'Home-api-svc'
        runOptions: 'inline'
        inline: |
          cd '/home/azureuser/construction_manage_api'
          sudo chmod +x docker-deploy.sh
          sudo ./docker-deploy.sh